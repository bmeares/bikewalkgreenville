name: bwg_app_native
description: "Bike Walk Greenville — map-first mobility app for Greenville, SC."
publish_to: 'none'

# +N is the Android versionCode; both MUST increase every release or
# in-place upgrades silently no-op on device. (Flet app ended at 29.)
version: 1.8.0+39

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.26.2
  dio: ^5.9.2
  provider: ^6.1.2
  geolocator: ^14.0.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.6.1
  flutter_local_notifications: ^22.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
