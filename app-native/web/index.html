<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Bike Walk Greenville — map-first mobility app for Greenville, SC.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BikeWalk Greenville">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- maplibre_gl_web 0.26.x requires the maplibre-gl JS/CSS on the page. -->
  <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
  <link href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' rel='stylesheet'/>

  <style>
    /* Keep provider credits readable in their own reserved footer strip. */
    .maplibregl-ctrl-attrib { max-width: calc(100vw - 24px); max-height: 36px;
      overflow-y: auto; font-size: 10px; line-height: 14px; }
    /* The app's locate button owns this action; retain the location source. */
    .maplibregl-ctrl-geolocate { display: none !important; }
    .maplibregl-ctrl-group:has(> .maplibregl-ctrl-geolocate:only-child) { display: none; }
  </style>
  <title>BikeWalk Greenville</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
