org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# maplibre_gl compiles with sourceCompatibility 21; Flutter's configured JDK is 17.
# The JDK 21 path is per-host, so it lives in ~/.gradle/gradle.properties, NOT here --
# a project-level org.gradle.java.home overrides every host's own setting.
# New build host: set org.gradle.java.home=<jdk21> there, or export JAVA_HOME.
