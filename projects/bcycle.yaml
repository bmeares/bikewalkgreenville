project_name: bcycle

root_dir: ../root

plugins_dir:
- ../.installed_plugins
- ../plugins

pipes:

# Station locations only — live availability is read straight from GBFS by
# `plugins/bcycle.py`; this pipe is the outage fallback for the map layer.
- connector: "plugin:bcycle"
  metric: "stations"
  location: "greenville"
  parameters:
    tags:
    - "bcycle"
    schema: "BCycle"
    target: "stations"
    columns:
      primary: "id"
    dtypes:
      id: "string"
      name: "string"
      address: "string"
      lat: "float"
      lon: "float"
      rental_uri: "string"

# Without this the pipe registers on the compose project's local instance
# instead of prod, and the container's `bcycle` job finds nothing to sync.
config:
  meerschaum:
    instance: sql:bwg
    connectors:
      sql:
        bwg: "{sql:bwg}"

  plugins:
    bwg:
      data_path: '{MRSM_ROOT_DIR}/../data'
